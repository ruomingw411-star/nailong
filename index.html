<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff8e5">
<title>奶龙</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; padding: clamp(12px, 4vw, 48px);
    display: grid; place-items: center; background: #fff8e5; color: #2d3025;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  }
  button, textarea { font: inherit; }
  button { cursor: pointer; }
  button:focus-visible, textarea:focus-visible {
    outline: 3px solid #526c3f; outline-offset: 3px;
  }
  main {
    width: min(100%, 1050px); display: grid; grid-template-columns: 2fr 3fr;
    border: 1px solid #eadcbf; border-radius: 30px; overflow: hidden;
    background: #fffef9; box-shadow: 0 18px 60px #7a552619;
  }
  .room {
    min-height: 340px; display: grid; justify-items: center; align-content: center;
    gap: 12px; padding: 24px; background: radial-gradient(#ffefad, #fbdf85);
    text-align: center;
  }
  h1, h2, p { margin: 0; }
  h1 { font-size: 2.35rem; letter-spacing: .12em; }
  .pet { border: 0; background: transparent; padding: 12px; border-radius: 30px; }
  .pet.hop { animation: hop .45s ease; }
  @keyframes hop { 45% { transform: translateY(-17px) rotate(-5deg); } }
  .pet-photo { width: 180px; height: 190px; object-fit: contain; border-radius: 28px; }
  [hidden] { display: none !important; }
  .dragon {
    display: block; position: relative; width: 155px; height: 165px;
    border-radius: 46% 46% 39% 39% / 54% 54% 40% 40%;
    background: radial-gradient(ellipse at 38% 24%, #ffeb87, #f6bc40 74%);
    box-shadow: inset -9px -10px 20px #cc811d35, 0 20px 16px -15px #9f681b70;
    margin: 0 auto 10px;
  }
  .eye {
    position: absolute; top: 37px; width: 29px; height: 34px;
    border-radius: 50%; background: radial-gradient(circle at 55% 59%, #151a10 43%, #94ad61 47%);
    animation: blink 6s infinite;
  }
  .eye.left { left: 37px; }
  .eye.right { right: 37px; }
  @keyframes blink { 47%, 51% { transform: scaleY(1); } 49% { transform: scaleY(.08); } }
  .smile {
    position: absolute; top: 66px; left: 56px; width: 43px; height: 16px;
    background: #65401e;
    clip-path: path("M 0 8 Q 21.5 18 43 8 Q 21.5 24 0 8 Z");
  }
  .chat {
    min-width: 0; height: min(72dvh, 690px); min-height: 430px;
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
  }
  header { padding: 18px 22px; border-bottom: 1px solid #efe8d8; }
  .chat-heading { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
  header h2 { font-size: 1.12rem; }
  header p { font-size: .86rem; color: #626553; }
  #messages { overflow: auto; padding: 18px 22px; }
  .message {
    width: fit-content; max-width: 87%; margin: 0 0 12px;
    padding: 9px 13px; border-radius: 16px 16px 16px 5px;
    background: #f2f4e8; overflow-wrap: anywhere; white-space: pre-wrap;
  }
  .message.mine { margin-left: auto; background: #ffe59d; border-radius: 16px 16px 5px 16px; }
  .message img {
    display: block; max-width: 100%; max-height: 210px;
    object-fit: contain; border-radius: 9px;
  }
  form { border-top: 1px solid #efe8d8; padding: 12px 16px; }
  .compose { display: flex; align-items: end; gap: 8px; }
  textarea {
    min-width: 0; flex: 1; resize: vertical; min-height: 46px; max-height: 125px;
    padding: 10px; border-radius: 13px; border: 1px solid #dfd8c7; background: white;
  }
  .action {
    min-height: 46px; padding: 0 13px; border-radius: 13px; border: 0;
    background: #f2eddf; color: inherit;
  }
  .send { background: #f3ca60; font-weight: 700; }
  #attachment { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  #thumbnail { width: 48px; height: 48px; object-fit: cover; border-radius: 8px; }
  #status { font-size: .84rem; color: #626553; }
  #status:empty { display: none; }
  @media (max-width: 640px) {
    main { grid-template-columns: 1fr; }
    .room { min-height: 0; padding: 12px 16px; gap: 4px; }
    h1 { font-size: 1.7rem; }
    .pet { zoom: .58; }
    .chat { height: max(370px, 60dvh); min-height: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .pet.hop, .eye { animation: none; } }

  .pet.is-laughing .eye {
    top: 43px;
    height: 17px;
    background: none;
    border-top: 4px solid #526235;
    animation: none;
  }
  .pet.is-laughing .eye::after { display: none; }
  .pet.is-laughing .smile {
    top: 72px; left: 57px; width: 41px; height: 24px;
    border-radius: 30% 30% 55% 55% / 24% 24% 76% 76%;
    background: radial-gradient(ellipse at 50% 110%, #ee9a83 36%, transparent 38%), #65401e;
    clip-path: none;
  }
</style>
</head>
<body>
<main>
  <section class="room" aria-labelledby="name">
    <button class="pet" id="pet" type="button" aria-label="摸摸奶龙">
      <img class="pet-photo" id="pet-photo" alt="" hidden>
      <span class="dragon" id="dragon" aria-hidden="true">
        <span class="eye left"></span><span class="eye right"></span>
        <span class="smile"></span>
      </span>
    </button>
    <h1 id="name">奶龙</h1>
    <p id="pet-reaction" aria-live="polite">点我摸摸头</p>
  </section>
  <section class="chat" aria-labelledby="chat-title">
    <header>
      <div class="chat-heading">
        <div>
          <h2 id="chat-title">和奶龙聊天</h2>
          <p>演示模式 · 照片和聊天存在当前浏览器</p>
        </div>
        <button class="action" id="reset-chat" type="button">重置全部</button>
      </div>
    </header>
    <div id="messages" role="log" aria-label="聊天记录" aria-live="polite"></div>
    <form id="composer">
      <div id="attachment" hidden>
        <img id="thumbnail" alt="待发送的照片">
        <button class="action" id="remove" type="button">移除照片</button>
      </div>
      <div class="compose">
        <input id="photo" type="file" accept="image/*" hidden>
        <button class="action" id="pick" type="button">照片</button>
        <textarea id="draft" rows="1" maxlength="1000"
          aria-label="聊天消息" placeholder="跟奶龙说点什么…"></textarea>
        <button class="action send" type="submit">发送</button>
      </div>
      <p id="status" role="status"></p>
    </form>
  </section>
</main>
<script>
  const storageKey = 'nailong-chat-v1';
  const byId = id => document.getElementById(id);
  const messages = byId('messages');
  const draft = byId('draft');
  const photo = byId('photo');
  const status = byId('status');
  let pendingPhoto = '';
  let photoSelection = 0;
  const welcomeMessage = { text: '嗨，我是奶龙！今天有什么想跟我分享的吗？' };
  let chat = [welcomeMessage];
  let chatVersion = 0;
  try {
    const saved = JSON.parse(localStorage.getItem(storageKey));
    if (Array.isArray(saved) && saved.length) chat = saved;
  } catch {}
  function showMessage(message) {
    const bubble = document.createElement('div');
    bubble.className = message.mine ? 'message mine' : 'message';
    bubble.setAttribute('aria-label', message.mine ? '你的消息' : '奶龙的消息');
    if (message.text) bubble.textContent = message.text;
    if (message.image) {
      const image = document.createElement('img');
      image.alt = '你分享的照片';
      image.src = message.image;
      image.addEventListener('load', () => {
        if (image.dataset.follow) messages.scrollTop = messages.scrollHeight;
      }, { once: true });
      bubble.append(image);
      image.dataset.follow = 'true';
    }
    messages.append(bubble);
    messages.scrollTop = messages.scrollHeight;
  }
  function addMessage(message) {
    chat.push(message);
    showMessage(message);
    try {
      localStorage.setItem(storageKey, JSON.stringify(chat));
    } catch {
      status.textContent = '浏览器存储空间不足，本次新消息可能无法在刷新后保留。';
    }
  }
  chat.forEach(showMessage);
  const pet = byId('pet');
  const portrait = byId('pet-photo');
  portrait.addEventListener('load', () => {
    portrait.hidden = false;
    byId('dragon').hidden = true;
  });
  portrait.src = './nailong.jpeg';
  const reaction = byId('pet-reaction');
  const laughAudio = new Audio('./ScreenRecording_11-17-2026%2010-52-30_1.mov');
  laughAudio.preload = 'none';
  const tapWindowMs = 1000;
  const laughDurationMs = 1200;
  let tapCount = 0;
  let firstTapTime = 0;

  pet.addEventListener('click', () => {
    pet.classList.remove('hop');
    void pet.offsetWidth;
    pet.classList.add('hop');
    if (pet.classList.contains('is-laughing')) return;

    const now = performance.now();
    if (tapCount === 0 || now - firstTapTime > tapWindowMs) {
      firstTapTime = now;
      tapCount = 0;
    }

    tapCount += 1;
    if (tapCount < 3) {
      reaction.textContent = tapCount === 1 ? '嘿嘿，再来一下' : '再摸一下就笑啦！';
      return;
    }

    tapCount = 0;
    pet.classList.add('is-laughing');
    reaction.textContent = '哈哈哈！';
    laughAudio.currentTime = 0;
    laughAudio.play().catch(() => {
      // Keep the expression available when the recording cannot play.
    });
    setTimeout(() => {
      pet.classList.remove('is-laughing');
      reaction.textContent = '点我摸摸头';
    }, laughDurationMs);
  });
  function clearPhoto() {
    photoSelection += 1;
    pendingPhoto = '';
    photo.value = '';
    byId('thumbnail').removeAttribute('src');
    byId('attachment').hidden = true;
  }
  byId('pick').addEventListener('click', () => photo.click());
  byId('remove').addEventListener('click', clearPhoto);
  photo.addEventListener('change', async () => {
    const file = photo.files[0];
    if (!file) return;
    const selection = ++photoSelection;
    let url;
    try {
      url = URL.createObjectURL(file);
      const image = new Image();
      image.src = url;
      await image.decode();
      if (selection !== photoSelection) return;
      const scale = Math.min(1, 800 / Math.max(image.width, image.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(image.width * scale));
      canvas.height = Math.max(1, Math.round(image.height * scale));
      canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
      pendingPhoto = canvas.toDataURL('image/jpeg', 0.78);
      byId('thumbnail').src = pendingPhoto;
      byId('attachment').hidden = false;
      status.textContent = '';
    } catch {
      if (selection === photoSelection) {
        status.textContent = '这张照片打不开，试试 JPEG 或 PNG。';
      }
    } finally {
      if (url) URL.revokeObjectURL(url);
    }
  });
  const memoryKey = 'nailong-memory-v1';

  function memoryReply(text) {
    const fact = text.match(/^记住(?:一下)?[：:\s，,]*(.*)$/s)?.[1]?.trim();
    const recall = /^(?:你)?记住了什么[？?]?$/.test(text);
    const clear = /^清除记忆[。！!！]?$/.test(text);
    if (fact === undefined && !recall && !clear) return null;
    if (fact === '') return '试试说「记住：我家猫换了新窝」。';

    try {
      if (clear) {
        localStorage.removeItem(memoryKey);
        return '奶龙的小本本已经清空了。';
      }
      const saved = JSON.parse(localStorage.getItem(memoryKey) ?? '[]');
      const facts = Array.isArray(saved) ? saved.filter(item => typeof item === 'string') : [];
      if (recall) {
        return facts.length
          ? '奶龙的小本本记着：\n' + facts.map(item => '· ' + item).join('\n')
          : '奶龙的小本本还是空的。试试说「记住：我家猫换了新窝」。';
      }
      if (!facts.includes(fact)) {
        facts.push(fact);
        localStorage.setItem(memoryKey, JSON.stringify(facts));
      }
      return '记住啦：' + fact;
    } catch {
      return '奶龙现在打不开小本本，浏览器可能限制了存储。';
    }
  }

  byId('reset-chat').addEventListener('click', () => {
    try {
      localStorage.removeItem(memoryKey);
      localStorage.removeItem(storageKey);
    } catch {
      status.textContent = '浏览器暂时无法清除记录，请重试。';
      return;
    }

    chatVersion += 1;
    chat = [welcomeMessage];
    draft.value = '';
    clearPhoto();
    messages.replaceChildren();
    showMessage(welcomeMessage);
    status.textContent = '聊天和记忆已清空。';
  });

  byId('composer').addEventListener('submit', event => {
    event.preventDefault();
    const text = draft.value.trim();
    const image = pendingPhoto;
    if (!text && !image) return;
    status.textContent = '';
    addMessage({ text, image, mine: true });
    draft.value = '';
    clearPhoto();
    let reply = '奶龙在听。今天有没有一件小事，让你特别想讲给我听？';
    const remembered = memoryReply(text);
    if (remembered !== null) {
      reply = remembered;
    } else if (image) {
      reply = '照片收到啦！你最想让我留意照片里的哪里？';
    } else if (/猫|咪/.test(text)) {
      reply = '说到猫猫，我想听听它今天干了什么。';
    } else if (/累|困/.test(text)) {
      reply = '奶龙来你旁边坐一小会儿。想聊聊今天最累的是哪件事吗？';
    }
    const version = chatVersion;
    setTimeout(() => {
      if (version === chatVersion) addMessage({ text: reply });
    }, 500);
  });
  draft.addEventListener('keydown', event => {
    if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
      event.preventDefault();
      byId('composer').requestSubmit();
    }
  });
</script>
 <style>

  .eye {

    background: radial-gradient(ellipse at 45% 35%, #afc783, #829b51);

    overflow: hidden;

  }

  .eye::after {

    content: "";

    position: absolute;

    top: 50%;

    left: 50%;

    width: 17px;

    height: 19px;

    border-radius: 50%;

    background: #151a10;

    transform: translate(

      calc(-50% + var(--gaze-x, 0px)),

      calc(-50% + var(--gaze-y, 0px))

    );

    transition: transform 160ms ease-out;

  }

  @media (prefers-reduced-motion: reduce) {

    .eye::after { transition: none; }

  }

</style>

<script>

  (() => {

    const eyes = document.querySelectorAll('#dragon .eye');

    document.addEventListener('click', event => {

      // 键盘触发的点击没有屏幕坐标。

      if (event.detail === 0) return;

      for (const eye of eyes) {

        const bounds = eye.getBoundingClientRect();

        const dx = event.clientX - (bounds.left + bounds.width / 2);

        const dy = event.clientY - (bounds.top + bounds.height / 2);

        const distance = Math.max(18, Math.hypot(dx, dy));

        eye.style.setProperty('--gaze-x', `${5 * dx / distance}px`);

        eye.style.setProperty('--gaze-y', `${6 * dy / distance}px`);

      }

    }, { capture: true });

  })();

</script>
</body>
</html>
